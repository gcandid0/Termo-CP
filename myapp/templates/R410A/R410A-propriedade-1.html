{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMO-CP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="icon" type="image/png" href="{% static 'myapp/img/favicon.png' %}">

    <link rel="stylesheet" href="{% static 'myapp/css/wizard_group_7.css' %}">

    <script>
        function updateLabel() {
            var selectedRadio = document.querySelector('input[name="property_choice"]:checked');
            if (!selectedRadio) return;

            var selectedValue = selectedRadio.value;
            var label = document.getElementById('value-label');
            var inputField = document.getElementById('value_input_field');
            var numberInput = document.getElementById('value_input');

            // Lógica de Label e Limites
            if (selectedValue == '0') {
                label.innerHTML = '<i class="fas fa-temperature-high"></i> ' +
                                '<span class="lang-text" ' +
                                'data-pt-br="Digite o valor da Temperatura (°C)" ' +
                                'data-en="Enter the Temperature value (°C)" ' +
                                'data-es="Introduzca el valor de la Temperatura (°C)">' +
                                'Digite o valor da Temperatura (°C)</span>';
                
                numberInput.setAttribute('min', '-64.34');
                numberInput.setAttribute('max', '360');
                numberInput.placeholder = phStr[currentLang];

            } else if (selectedValue == '1') {
                label.innerHTML = '<i class="fas fa-tachometer-alt"></i> ' +
                                '<span class="lang-text" ' +
                                'data-pt-br="Digite o valor da Pressão (kPa)" ' +
                                'data-en="Enter the Pressure value (kPa)" ' +
                                'data-es="Introduzca el valor de la Presión (kPa)">' +
                                'Digite o valor da Pressão (kPa)</span>';
                
                numberInput.setAttribute('min', '50');
                numberInput.setAttribute('max', '4901.2');
                numberInput.placeholder = phStr[currentLang];
            }

            inputField.style.display = 'block';
        }

        document.addEventListener('DOMContentLoaded', function() {
            var radios = document.querySelectorAll('input[name="property_choice"]');
            radios.forEach(function(radio) {
                radio.addEventListener('change', updateLabel);
            });
        });
    </script>
</head>
<body>
    <header>
        <h1>TERMO-CP</h1>
        <nav>
            <a href="/">Início</a>
            <a href="{% url 'cilindro' %}">Estados</a>
            <a href="{% url 'gasideal' %}">Processos</a>
            <a href="{% url 'contato' %}">Contato</a>
        </nav>
    </header>

    <div class="main-content">
        <div class="container">
            <i class="fas fa-sliders-h" style="font-size: 2.2em; color: var(--accent-water); margin-bottom: 10px;"></i>

            <h2>R-410A — Selecione a primeira propriedade</h2>

            <form method="post">
                {% csrf_token %}

                <div class="selection-grid">
                    {% for radio in form.property_choice %}
                    <label class="option-card">
                        {{ radio.tag }}
                        <i class="fas fa-check-circle check-indicator"></i>

                        {% if "Temperatura" in radio.choice_label %}
                            <i class="fas fa-temperature-high"></i>
                        {% elif "Pressão" in radio.choice_label or "Pressao" in radio.choice_label %}
                            <i class="fas fa-tachometer-alt"></i>
                        {% else %}
                            <i class="fas fa-cube"></i>
                        {% endif %}

                        <span>{{ radio.choice_label }}</span>
                    </label>
                    {% endfor %}
                </div>

                <div id="value_input_field" style="display: none;">
                    <label id="value-label" for="value_input">{{ form.value_input.label }}</label>
                    <input type="number" id="value_input" name="value_input" step="any" required placeholder="Digite o valor">
                </div>

                <div class="button-container">
                    <a href="/" class="btn btn-secondary">
                        <i class="fas fa-home" style="margin-right: 8px;"></i> Início
                    </a>

                    <button type="submit" class="btn btn-primary">
                        Continuar <i class="fas fa-arrow-right" style="margin-left: 8px;"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
