<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMO-CP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        /* --- Variáveis CSS --- */
        :root {
            --primary-color: #20376B;
            --secondary-color: #0D6AB0;
            --accent-water: #00A8FF;
            --light-bg: #f0f2f5;
            --card-bg: white;
            --text-color: #333;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
            --hover-transition: all 0.3s ease;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--light-bg);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            color: var(--text-color);
        }

        /* HEADER */
        header {
            background-color: var(--primary-color);
            color: white;
            padding: 15px 40px;
            box-shadow: var(--shadow);
            width: 100%;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }

        header h1 {
            margin: 0;
            font-size: 1.8em;
            margin-right: 30px;
            flex-shrink: 0;
        }

        nav { display: flex; align-items: center; }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 1em;
            padding: 5px 10px;
            border-radius: 4px;
            transition: var(--hover-transition);
        }

        nav a:hover, nav a.active {
            color: white;
            background-color: var(--secondary-color);
        }

        /* CONTEÚDO PRINCIPAL */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 100px 20px 80px;
            width: 100%;
            justify-content: center;
        }

        /* Container Compacto */
        .container {
            max-width: 650px;
            width: 100%;
            background: var(--card-bg);
            border-radius: 10px;
            box-shadow: var(--shadow);
            padding: 30px 25px;
            text-align: center;
        }

        h2 {
            color: var(--primary-color);
            font-size: 1.5em;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        /* --- GRID DE SELEÇÃO COMPACTO (CARDS) --- */
        .selection-grid {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .selection-grid input[type="radio"] {
            display: none;
        }

        .option-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 110px;
            height: 110px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            background-color: #fff;
            color: #666;
        }

        .option-card i.main-icon {
            font-size: 1.8em;
            margin-bottom: 8px;
            color: #999;
            transition: transform 0.3s ease;
        }

        .option-card span {
            font-weight: bold;
            font-size: 0.85em;
            text-align: center;
            line-height: 1.2;
        }

        .option-card:hover {
            border-color: var(--secondary-color);
            background-color: #f8fbff;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        /* ESTADO SELECIONADO */
        .option-card:has(input:checked) {
            border-color: var(--secondary-color);
            background-color: #eef7fc;
            color: var(--primary-color);
            box-shadow: 0 2px 8px rgba(13, 106, 176, 0.15);
        }

        .option-card:has(input:checked) i.main-icon {
            color: var(--secondary-color);
            transform: scale(1.1);
        }

        .check-indicator {
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 0.9em;
            color: var(--secondary-color);
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .option-card:has(input:checked) .check-indicator {
            opacity: 1;
        }

        /* --- INPUT DE VALOR --- */
        #value_input_field {
            margin-top: 15px;
            width: 100%;
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
            animation: fadeIn 0.4s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #value-label {
            font-weight: bold;
            color: var(--primary-color);
            display: block;
            margin-bottom: 12px;
            font-size: 1em;
        }

        input[type="number"] {
            padding: 10px;
            width: 100%;
            max-width: 280px;
            font-size: 1.1em;
            border: 2px solid #ccc;
            border-radius: 6px;
            text-align: center;
            transition: border-color 0.3s ease;
        }

        input[type="number"]:focus {
            border-color: var(--secondary-color);
            outline: none;
        }

        /* Botões */
        .button-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
            width: 100%;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            text-decoration: none;
            transition: var(--hover-transition);
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            min-width: 130px;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }
        .btn-primary:hover {
            background-color: var(--secondary-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        /* RODAPÉ PADRONIZADO */
        footer {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            padding: 12px 40px;
            position: fixed;
            bottom: 0;
            left: 0;
            font-size: 0.9em;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .footer-left, .footer-center, .footer-right { flex: 1; }
        .footer-left { text-align: left; }
        .footer-center { text-align: center; }
        .footer-right { text-align: right; }

        /* Mobile */
        @media (max-width: 768px) {
            header { flex-direction: column; padding: 10px 20px; position: static; }
            header h1 { margin-right: 0; margin-bottom: 10px; }
            nav { flex-wrap: wrap; justify-content: center; gap: 5px; }
            .main-content { padding-top: 20px; padding-bottom: 120px; }
            .option-card { width: 45%; height: 100px; }
            .button-container { flex-direction: column; }
            .btn { width: 100%; }

            footer {
                flex-direction: column;
                gap: 5px;
                padding: 15px 20px;
                text-align: center;
            }
            .footer-left, .footer-center, .footer-right { text-align: center; }
        }
    </style>

    <script>
        function updateLabel() {
            var selectedRadio = document.querySelector('input[name="property_choice"]:checked');
            var inputField = document.getElementById('value_input_field');
            var label = document.getElementById('value-label');
            var numberInput = document.getElementById('value_input');

            if (!selectedRadio) {
                inputField.style.display = 'none';
                return;
            }

            var selectedValue = selectedRadio.value;

            // Mapeamento de Labels, Ícones, Artigos (do/da) e Unidades
            var info = {
                '1': { text: 'Temperatura', unidade: '°C', icon: 'fas fa-temperature-high', artigo: 'da', min: 0, max: 1000 },
                '2': { text: 'Volume', unidade: 'm³', icon: 'fas fa-cube', artigo: 'do', min: 0, max: 1000 },
                '8': { text: 'Calor Transferido', unidade: 'kJ/kg', icon: 'fas fa-fire-alt', artigo: 'do', min: 0, max: 1000 }
            };

            var prop = info[selectedValue];

            if (prop) {
                label.innerHTML = `<i class="${prop.icon}"></i> Digite o valor ${prop.artigo} ${prop.text} (${prop.unidade}):`;
                numberInput.setAttribute('min', prop.min);
                numberInput.setAttribute('max', prop.max);
                numberInput.setAttribute('required', true);
                inputField.style.display = 'flex';
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            var radios = document.querySelectorAll('input[name="property_choice"]');
            radios.forEach(function(radio) {
                radio.addEventListener('change', updateLabel);
            });
            // Inicializa se houver valor pré-selecionado
            updateLabel();
        });
    </script>
</head>
<body>
    <header>
        <h1>TERMO-CP</h1>
        <nav>
            <a href="/">Início</a>
            <a href="{% url 'cilindro' %}">Estados</a>
            <a href="{% url 'gasideal' %}">Processos</a>
            <a href="{% url 'contato' %}">Contato</a>
        </nav>
    </header>

    <div class="main-content">
        <div class="container">
            <i class="fas fa-list-check" style="font-size: 2.2em; color: var(--accent-water); margin-bottom: 15px; display: block; text-align: center;"></i>

            <h2>Selecione a Quarta Propriedade</h2>

            <form method="post">
                {% csrf_token %}

                <div class="selection-grid">
                    {% for radio in form.property_choice %}
                    <label class="option-card">
                        {{ radio.tag }}
                        <i class="fas fa-check-circle check-indicator"></i>

                        {% if "1" in radio.data.value %}
                            <i class="fas fa-temperature-high main-icon"></i>
                        {% elif "2" in radio.data.value %}
                            <i class="fas fa-cube main-icon"></i>
                        {% elif "8" in radio.data.value %}
                            <i class="fas fa-fire-alt main-icon"></i>
                        {% else %}
                            <i class="fas fa-flask main-icon"></i>
                        {% endif %}

                        <span>{{ radio.choice_label }}</span>
                    </label>
                    {% endfor %}
                </div>

                <div id="value_input_field" style="display: none;">
                    <label id="value-label" for="value_input"></label>
                    <input type="number" id="value_input" name="value_input" step="any" placeholder="Digite o valor">
                </div>

                <div class="button-container">
                    <button type="submit" class="btn btn-primary">
                        Enviar <i class="fas fa-paper-plane" style="margin-left: 8px;"></i>
                    </button>

                    <a href="javascript:history.back()" class="btn btn-secondary">
                        <i class="fas fa-arrow-left" style="margin-right: 8px;"></i> Voltar
                    </a>
                </div>
            </form>
        </div>
    </div>

    <footer>
        <div class="footer-left">TERMO-CP &ndash; Gabriel Candido e Fábio Fonseca</div>
        <div class="footer-center">Última atualização: 07/04/2026</div>
        <div class="footer-right">Python | Django | HTML5 | JS</div>
    </footer>
</body>
</html>
