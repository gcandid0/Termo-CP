{% extends 'base.html' %}

{% block title %}TERMO-CP{% endblock %}

{% block extra_css %}
<style>
    /* Container Compacto (Centralizado pelo .main-content do base.html) */
    .container {
        max-width: 600px;
        width: 100%;
        background: var(--card-bg, white);
        border-radius: 10px;
        box-shadow: var(--shadow);
        padding: 30px 25px;
        text-align: center;
        margin: auto; /* Garante que fique centralizado */
    }

    h2 {
        color: var(--primary-color);
        font-size: 1.5em;
        margin-bottom: 20px;
        border-bottom: 1px solid #eee;
        padding-bottom: 10px;
    }

    /* --- GRID DE SELEÇÃO (CARDS) --- */
    .selection-grid {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-bottom: 25px;
        flex-wrap: wrap;
    }

    .selection-grid input[type="radio"] { display: none; }

    /* Cartão Pequeno (110px) */
    .option-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100px;
        height: 100px;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.2s ease;
        position: relative;
        background-color: #fff;
        color: #666;
    }

    .option-card i.fa-solid, .option-card i.fas {
        font-size: 1.8em;
        margin-bottom: 8px;
        color: #999;
        transition: color 0.3s ease;
    }

    .option-card span {
        font-weight: bold;
        font-size: 0.85em;
        text-align: center;
        line-height: 1.2;
    }

    .option-card:hover {
        border-color: var(--secondary-color);
        background-color: #f8fbff;
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    /* ESTADO SELECIONADO */
    .option-card:has(input:checked) {
        border-color: var(--secondary-color);
        background-color: #eef7fc;
        color: var(--primary-color);
        box-shadow: 0 2px 8px rgba(13, 106, 176, 0.15);
    }

    .option-card:has(input:checked) i { color: var(--secondary-color); }

    .check-indicator {
        position: absolute; top: 5px; right: 5px; font-size: 0.9em;
        color: var(--secondary-color) !important; opacity: 0; transition: opacity 0.2s ease;
    }

    .option-card:has(input:checked) .check-indicator { opacity: 1; }

    /* --- INPUT DE VALOR --- */
    #value_input_field {
        margin-top: 15px;
        width: 100%;
        background-color: #f9f9f9;
        padding: 15px;
        border-radius: 8px;
        border: 1px solid #ddd;
        animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(5px); }
        to { opacity: 1; transform: translateY(0); }
    }

    #value-label {
        font-weight: bold;
        color: var(--primary-color);
        display: block;
        margin-bottom: 10px;
        font-size: 1em;
    }

    input[type="number"] {
        padding: 10px;
        width: 100%;
        max-width: 250px;
        font-size: 1.1em;
        border: 2px solid #ccc;
        border-radius: 6px;
        text-align: center;
    }
    input[type="number"]:focus { border-color: var(--secondary-color); outline: none; }

    /* Botões de Ação */
    .button-container {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-top: 25px;
        width: 100%;
    }

    .btn {
        padding: 10px 20px;
        border-radius: 6px;
        font-size: 1em;
        cursor: pointer;
        text-decoration: none;
        transition: var(--hover-transition);
        border: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        min-width: 130px;
    }

    .btn-primary { background-color: var(--primary-color); color: white; }
    .btn-primary:hover { background-color: var(--secondary-color); transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.2); }

    .btn-secondary { background-color: #6c757d; color: white; }
    .btn-secondary:hover { background-color: #5a6268; transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.2); }

    /* Mobile */
    @media (max-width: 768px) {
        .option-card { width: 45%; height: 100px; }
        .button-container { flex-direction: column; }
        .btn { width: 100%; }
    }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <i class="fas fa-atom" style="font-size: 2.2em; color: #00A8FF; margin-bottom: 10px;"></i>

    <h2>
        <span class="lang-text" data-pt-br="Selecione a primeira constante" data-en="Select the first constant" data-es="Seleccione la primera constante">
            Selecione a primeira constante
        </span>
    </h2>

    <form method="post">
        {% csrf_token %}

        <div class="selection-grid">
            {% for radio in form.property_choice %}
            <label class="option-card">
                {{ radio.tag }}
                <i class="fas fa-check-circle check-indicator"></i>

                {% if "Cv0" in radio.choice_label %} <i class="fas fa-compress-arrows-alt"></i>
                {% elif "Cp0" in radio.choice_label %} <i class="fas fa-expand-arrows-alt"></i>
                {% elif "R" in radio.choice_label %} <i class="fas fa-superscript"></i>
                {% elif "K" in radio.choice_label %} <i class="fas fa-project-diagram"></i>
                {% else %} <i class="fas fa-calculator"></i> {% endif %}

                <span>{{ radio.choice_label }}</span>
            </label>
            {% endfor %}
        </div>

        <div id="value_input_field" style="display: none;">
            <label id="value-label" for="value_input"></label>
            <input type="number" id="value_input" name="value_input" step="any" required>
        </div>

        <div class="button-container">
            <a href="/" class="btn btn-secondary">
                <i class="fas fa-home" style="margin-right: 8px;"></i> 
                <span class="lang-text" data-pt-br="Tela Inicial" data-en="Home Screen" data-es="Pantalla de Inicio">Tela Inicial</span>
            </a>

            <button type="submit" class="btn btn-primary">
                <span class="lang-text" data-pt-br="Continuar" data-en="Continue" data-es="Continuar">Continuar</span> 
                <i class="fas fa-arrow-right" style="margin-left: 8px;"></i>
            </button>
        </div>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script>
    function updateLabel() {
        var selectedRadio = document.querySelector('input[name="property_choice"]:checked');
        if (!selectedRadio) {
            document.getElementById('value_input_field').style.display = 'none';
            return;
        }

        var selectedValue = selectedRadio.value;
        var label = document.getElementById('value-label');
        var inputField = document.getElementById('value_input_field');
        var numberInput = document.getElementById('value_input');

        // Pega o idioma selecionado no navegador (definido no base.html)
        var lang = localStorage.getItem('preferredLang') || 'pt-br';

        // Definição das constantes e seus limites
        var info = {
            '11': { text: 'Cv0', min: 0, max: 1000 },
            '12': { text: 'Cp0', min: 0, max: 1000 },
            '13': { text: 'R', min: 0.0001, max: 1000 },
            '14': { text: 'K', min: 1.0001, max: 1000 }
        };

        // Dicionário de traduções dinâmicas para o JavaScript
        var dict = {
            'pt-br': { label: 'Digite o valor de', placeholder: 'Digite o valor' },
            'en': { label: 'Enter the value for', placeholder: 'Enter the value' },
            'es': { label: 'Ingrese el valor de', placeholder: 'Ingrese el valor' }
        };

        if (info[selectedValue]) {
            // Atualiza o texto mesclando o dicionário de idioma com o nome da constante
            label.innerHTML = `<i class="fas fa-ruler-combined"></i> ${dict[lang].label} ${info[selectedValue].text}`;
            numberInput.setAttribute('min', info[selectedValue].min);
            numberInput.setAttribute('max', info[selectedValue].max);
            numberInput.placeholder = dict[lang].placeholder;
            inputField.style.display = 'block';
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        // Escuta os cliques nas opções de rádio
        var radios = document.querySelectorAll('input[name="property_choice"]');
        radios.forEach(function(radio) {
            radio.addEventListener('change', updateLabel);
        });

        // Atualiza os inputs dinâmicos se o usuário trocar a língua com um rádio já selecionado
        var langOptions = document.querySelectorAll('.lang-option');
        langOptions.forEach(function(btn) {
            btn.addEventListener('click', function() {
                setTimeout(updateLabel, 50); // Aguarda o localStorage atualizar no base.html
            });
        });
    });
</script>
{% endblock %}
