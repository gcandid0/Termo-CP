{% extends 'base.html' %}

{% block title %}TERMO-CP{% endblock %}

{% block extra_css %}
<style>
    /* Container Compacto */
    .container {
        max-width: 600px;
        width: 100%;
        background: var(--card-bg, white);
        border-radius: 10px;
        box-shadow: var(--shadow);
        padding: 30px 25px;
        text-align: center;
        margin: auto;
    }

    h2 {
        color: var(--primary-color);
        font-size: 1.5em;
        margin-bottom: 20px;
        border-bottom: 1px solid #eee;
        padding-bottom: 10px;
    }

    /* --- INPUT DE VALOR --- */
    #value_input_field {
        margin-top: 10px;
        width: 100%;
        background-color: #f9f9f9;
        padding: 25px;
        border-radius: 8px;
        border: 1px solid #ddd;
    }

    label {
        font-weight: bold;
        color: var(--primary-color);
        display: block;
        margin-bottom: 15px;
        font-size: 1.1em;
    }

    input[type="number"] {
        padding: 12px;
        width: 100%;
        max-width: 250px;
        font-size: 1.1em;
        border: 2px solid #ccc;
        border-radius: 6px;
        text-align: center;
        outline: none;
        transition: border-color 0.3s ease;
    }

    input[type="number"]:focus {
        border-color: var(--secondary-color);
    }

    /* Botões de Ação */
    .button-container {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-top: 30px;
        width: 100%;
    }

    .btn {
        padding: 10px 20px;
        border-radius: 6px;
        font-size: 1em;
        cursor: pointer;
        text-decoration: none;
        transition: var(--hover-transition);
        border: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        min-width: 130px;
    }

    .btn-primary { background-color: var(--primary-color); color: white; }
    .btn-primary:hover { background-color: var(--secondary-color); transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.2); }

    .btn-secondary { background-color: #6c757d; color: white; }
    .btn-secondary:hover { background-color: #5a6268; transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.2); }

    /* Mobile */
    @media (max-width: 768px) {
        .button-container { flex-direction: column; }
        .btn { width: 100%; }
    }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <i class="fas fa-thermometer-half" style="font-size: 2.5em; color: #00A8FF; margin-bottom: 15px;"></i>

    <h2>
        <span class="lang-text" data-pt-br="Condições do ambiente" data-en="Environment conditions" data-es="Condiciones del ambiente">
            Condições do ambiente
        </span>
    </h2>

    <form method="post">
        {% csrf_token %}
        <div style="display:none;">{{ form.property_choice }}</div>

        <div id="value_input_field">
            <label for="Tviz_value_input">
                <i class="fas fa-temperature-low" style="margin-right: 5px;"></i>
                <span class="lang-text" data-pt-br="Digite o valor da Temperatura da vizinhança (°C):" data-en="Enter the Surroundings Temperature value (°C):" data-es="Ingrese el valor de la Temperatura del entorno (°C):">
                    Digite o valor da Temperatura da vizinhança (°C):
                </span>
            </label>
            <input type="number" id="Tviz_value_input" name="Tviz_value_input" step="any" min="-500" max="500000" required>
        </div>

        <div class="button-container">
            <a href="{% url 'ask_known5_8' %}" class="btn btn-secondary">
                <i class="fas fa-arrow-left" style="margin-right: 8px;"></i> 
                <span class="lang-text" data-pt-br="Voltar" data-en="Back" data-es="Atrás">Voltar</span>
            </a>

            <button type="submit" class="btn btn-primary">
                <span class="lang-text" data-pt-br="Calcular" data-en="Calculate" data-es="Calcular">Calcular</span> 
                <i class="fas fa-calculator" style="margin-left: 8px;"></i>
            </button>
        </div>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script>
    function updatePlaceholder() {
        var input = document.getElementById('Tviz_value_input');
        var lang = localStorage.getItem('preferredLang') || 'pt-br';
        
        var placeholders = {
            'pt-br': 'Digite o valor',
            'en': 'Enter the value',
            'es': 'Ingrese el valor'
        };
        
        if(input) {
            input.placeholder = placeholders[lang];
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        // Inicializa o placeholder com a linguagem correta
        updatePlaceholder();

        // Atualiza o placeholder automaticamente se o usuário trocar de idioma pelo header
        var langOptions = document.querySelectorAll('.lang-option');
        langOptions.forEach(function(btn) {
            btn.addEventListener('click', function() {
                setTimeout(updatePlaceholder, 50); // Dá um tempinho pro localStorage atualizar no script do base.html
            });
        });
    });
</script>
{% endblock %}
