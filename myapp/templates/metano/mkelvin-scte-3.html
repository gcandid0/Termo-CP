{% extends 'base.html' %}

{% block title %}TERMO-CP{% endblock %}

{% block extra_css %}
<style>
    /* Wrapper para alinhar o conteúdo no centro da main-content do base.html */
    .form-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        width: 100%;
        min-height: 100%;
    }

    /* Container Compacto */
    .container {
        max-width: 750px;
        width: 100%;
        background: var(--card-bg, white);
        border-radius: 10px;
        box-shadow: var(--shadow);
        padding: 30px 25px;
        text-align: center;
    }

    h2 {
        color: var(--primary-color);
        font-size: 1.6em;
        margin-bottom: 25px;
        border-bottom: 1px solid #eee;
        padding-bottom: 15px;
    }

    /* --- GRID DE SELEÇÃO COMPACTO --- */
    .selection-grid {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-bottom: 25px;
        flex-wrap: wrap;
    }

    .selection-grid input[type="radio"] { 
        display: none; 
    }

    /* Cartão Pequeno (100px) */
    .option-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100px;
        height: 100px;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.2s ease;
        position: relative;
        background-color: #fff;
        color: #666;
    }

    .option-card i.icon-main {
        font-size: 1.8em;
        margin-bottom: 8px;
        color: #999;
        transition: color 0.3s ease;
    }

    .option-card span {
        font-weight: bold;
        font-size: 0.85em;
        text-align: center;
        line-height: 1.2;
    }

    .option-card:hover {
        border-color: var(--secondary-color);
        background-color: #f8fbff;
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .option-card:has(input:checked) {
        border-color: var(--secondary-color);
        background-color: #eef7fc;
        color: var(--primary-color);
        box-shadow: 0 2px 8px rgba(13, 106, 176, 0.15);
    }

    .option-card:has(input:checked) i.icon-main {
        color: var(--secondary-color);
    }

    .check-indicator {
        position: absolute;
        top: 5px;
        right: 5px;
        font-size: 0.8em;
        color: var(--secondary-color);
        opacity: 0;
        transition: opacity 0.2s ease;
    }

    .option-card:has(input:checked) .check-indicator {
        opacity: 1;
    }

    /* --- INPUT DE VALOR --- */
    #value_input_field {
        margin-top: 15px;
        width: 100%;
        background-color: #f9f9f9;
        padding: 20px;
        border-radius: 8px;
        border: 1px solid #ddd;
        animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(5px); }
        to { opacity: 1; transform: translateY(0); }
    }

    #value-label {
        font-weight: bold;
        color: var(--primary-color);
        display: block;
        margin-bottom: 10px;
        font-size: 1.1em;
    }

    input[type="number"] {
        padding: 12px;
        width: 100%;
        max-width: 250px;
        font-size: 1.1em;
        border: 2px solid #ccc;
        border-radius: 6px;
        text-align: center;
        outline: none;
        transition: border-color 0.3s ease;
    }

    input[type="number"]:focus {
        border-color: var(--secondary-color);
    }

    /* Botões de Ação */
    .button-container {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-top: 30px;
        width: 100%;
    }

    .btn {
        padding: 12px 25px;
        border-radius: 6px;
        font-size: 1em;
        cursor: pointer;
        text-decoration: none;
        transition: var(--hover-transition);
        border: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        min-width: 140px;
    }

    .btn-primary { background-color: var(--primary-color); color: white; }
    .btn-primary:hover { background-color: var(--secondary-color); transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.2); }

    .btn-secondary { background-color: #6c757d; color: white; }
    .btn-secondary:hover { background-color: #5a6268; transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.2); }

    /* Mobile */
    @media (max-width: 768px) {
        .option-card { width: 30%; height: 100px; }
        .button-container { flex-direction: column; }
        .btn { width: 100%; }
    }
</style>
{% endblock %}

{% block content %}
<div class="form-wrapper">
    <div class="container">
        <i class="fas fa-sliders-h" style="font-size: 2.5em; color: #00A8FF; margin-bottom: 15px;"></i>

        <h2 class="lang-text" 
            data-pt-br="Selecione a propriedade no estado final" 
            data-en="Select the property in the final state" 
            data-es="Seleccione la propiedad en el estado final">
            Selecione a propriedade no estado final
        </h2>

        <form method="post">
            {% csrf_token %}

            <div class="selection-grid">
                {% for radio in form.property_choice %}
                <label class="option-card"
                    style="
                    {% if 'Temperatura' in radio.choice_label %}order: 1;
                    {% elif 'Pressão' in radio.choice_label or 'Pressao' in radio.choice_label %}order: 2;
                    {% elif 'Volume' in radio.choice_label %}order: 3;
                    {% elif 'Energia' in radio.choice_label %}order: 4;
                    {% elif 'Entalpia' in radio.choice_label %}order: 5;
                    {% elif 'Entropia' in radio.choice_label %}order: 6;
                    {% elif 'Título' in radio.choice_label %}order: 7;
                    {% elif 'Trabalho' in radio.choice_label %}order: 8;
                    {% elif 'Calor' in radio.choice_label %}order: 9;
                    {% endif %}"
                >
                    {{ radio.tag }}
                    <i class="fas fa-check-circle check-indicator"></i>

                    <!-- Cobertura completa de Ícones para todas as opções que possam vir do formulário -->
                    {% if "Temperatura" in radio.choice_label %} <i class="fas fa-temperature-high icon-main"></i>
                    {% elif "Pressão" in radio.choice_label or "Pressao" in radio.choice_label %} <i class="fas fa-tachometer-alt icon-main"></i>
                    {% elif "Volume" in radio.choice_label %} <i class="fas fa-cube icon-main"></i>
                    {% elif "Energia" in radio.choice_label %} <i class="fas fa-bolt icon-main"></i>
                    {% elif "Entalpia" in radio.choice_label %} <i class="fas fa-fire icon-main"></i>
                    {% elif "Entropia" in radio.choice_label %} <i class="fas fa-random icon-main"></i>
                    {% elif "Título" in radio.choice_label %} <i class="fas fa-percentage icon-main"></i>
                    {% elif "Trabalho" in radio.choice_label %} <i class="fas fa-cogs icon-main"></i>
                    {% elif "Calor" in radio.choice_label %} <i class="fas fa-fire-alt icon-main"></i>
                    {% else %} <i class="fas fa-flask icon-main"></i> {% endif %}

                    <span>{{ radio.choice_label }}</span>
                </label>
                {% endfor %}
            </div>

            <div id="value_input_field" style="display: none;">
                <label id="value-label" for="value_input">
                    {{ form.value_input.label }}
                </label>
                <input type="number" id="value_input" name="value_input" step="any" required placeholder="Digite o valor">
            </div>

            <div class="button-container">
                <a href="javascript:history.back()" class="btn btn-secondary">
                    <i class="fas fa-arrow-left" style="margin-right: 8px;"></i> 
                    <span class="lang-text" data-pt-br="Voltar" data-en="Go Back" data-es="Volver">Voltar</span>
                </a>

                <button type="submit" class="btn btn-primary">
                    <span class="lang-text" data-pt-br="Calcular" data-en="Calculate" data-es="Calcular">Calcular</span> 
                    <i class="fas fa-calculator" style="margin-left: 8px;"></i>
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    function updateLabel() {
        var selectedRadio = document.querySelector('input[name="property_choice"]:checked');
        if (!selectedRadio) {
            document.getElementById('value_input_field').style.display = 'none';
            return;
        }

        var selectedValue = selectedRadio.value;
        var label = document.getElementById('value-label');
        var inputField = document.getElementById('value_input_field');
        var numberInput = document.getElementById('value_input');

        let currentLang = localStorage.getItem('preferredLang') || 'pt-br';
        let phStr = {
            'pt-br': 'Digite o valor',
            'en': 'Enter the value',
            'es': 'Introduzca el valor'
        };

        // Mapeamento expandido para lidar com Trabalho, Calor e as demais propriedades nos 3 idiomas
        var info = {
            '0': { icon: 'fas fa-temperature-high', min: 90.7, max: 575.0, 
                pt: 'Digite o valor da Temperatura (K)', en: 'Enter the Temperature value (K)', es: 'Introduzca el valor de la Temperatura (K)'},
            '1': { icon: 'fas fa-tachometer-alt', min: 11.7, max: 8000, 
                pt: 'Digite o valor da Pressão (kPa)', en: 'Enter the Pressure value (kPa)', es: 'Introduzca el valor de la Presión (kPa)'},
            '2': { icon: 'fas fa-cube', min: 0.002215, max: 3.98163, 
                pt: 'Digite o valor do Volume Específico (m³/kg)', en: 'Enter the Specific Volume value (m³/kg)', es: 'Introduzca el valor del Volumen Específico (m³/kg)'},
            '3': { icon: 'fas fa-bolt', min: -358.1, max: 1053.98, 
                pt: 'Digite o valor da Energia Interna (kJ/kg)', en: 'Enter the Internal Energy value (kJ/kg)', es: 'Introduzca el valor de la Energía Interna (kJ/kg)'},
            '4': { icon: 'fas fa-fire', min: -358.07, max: 1353.77, 
                pt: 'Digite o valor da Entalpia (kJ/kg)', en: 'Enter the Enthalpy value (kJ/kg)', es: 'Introduzca el valor de la Entalpía (kJ/kg)'},
            '5': { icon: 'fas fa-random', min: 4.2264, max: 12.4661, 
                pt: 'Digite o valor da Entropia (kJ/kg·K)', en: 'Enter the Entropy value (kJ/kg·K)', es: 'Introduzca el valor de la Entropía (kJ/kg·K)'},
            '6': { icon: 'fas fa-percentage', min: 0, max: 100, 
                pt: 'Digite o valor do Título (%)', en: 'Enter the Quality value (%)', es: 'Introduzca el valor del Título (%)'},
            '7': { icon: 'fas fa-fire-alt', min: -50000, max: 50000,
                   pt: 'Digite o valor do Calor Transferido (kJ)', en: 'Enter the Transferred Heat value (kJ)', es: 'Introduzca el valor del Calor Transferido (kJ)' },
            '8': { icon: 'fas fa-fire-alt', min: -50000, max: 50000,
                   pt: 'Digite o valor do Calor Transferido (kJ)', en: 'Enter the Transferred Heat value (kJ)', es: 'Introduzca el valor del Calor Transferido (kJ)' }
        };

        var prop = info[selectedValue];

        if (prop) {
            label.innerHTML = `<i class="${prop.icon}"></i> <span class="lang-text" data-pt-br="${prop.pt}" data-en="${prop.en}" data-es="${prop.es}">${prop.pt}</span>`;
            numberInput.setAttribute('min', prop.min);
            numberInput.setAttribute('max', prop.max);
        } else {
            // Fallback caso venha um valor não mapeado (segurança)
            label.innerHTML = `<i class="fas fa-pencil-alt"></i> <span class="lang-text" data-pt-br="Digite o valor da propriedade selecionada:" data-en="Enter the selected property value:" data-es="Introduzca el valor de la propiedad seleccionada:">Digite o valor da propriedade selecionada:</span>`;
            numberInput.removeAttribute('min');
            numberInput.removeAttribute('max');
        }

        numberInput.placeholder = phStr[currentLang];
        inputField.style.display = 'block';

        // Dispara a tradução para formatar o label que acabou de ser injetado (caso não esteja em pt-br)
        if(currentLang !== 'pt-br') {
             const elements = document.querySelectorAll('.lang-text');
             elements.forEach(el => {
                 const newText = el.getAttribute('data-' + currentLang);
                 if (newText) el.textContent = newText;
             });
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        var radios = document.querySelectorAll('input[name="property_choice"]');
        radios.forEach(function(radio) {
            radio.addEventListener('change', updateLabel);
        });
        updateLabel();

        // Escuta os cliques nas bandeiras de idiomas para atualizar o placeholder dinamicamente
        document.addEventListener('click', function(e) {
            if (e.target.closest('.lang-option')) {
                setTimeout(updateLabel, 50); 
            }
        });
    });
</script>
{% endblock %}
